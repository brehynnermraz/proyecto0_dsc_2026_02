# Los secretos (STORAGE_TOKEN, JWT_SECRET) traen un valor por defecto
# ("cambia-esto") para que `docker compose up` funcione SIN crear un .env: es un
# proyecto de aprendizaje local. Para algo real, sobreescríbelos con un .env en
# esta carpeta (Compose lo lee solo) o exportándolos en el shell:
#   STORAGE_TOKEN=xxxx JWT_SECRET=yyyy docker compose up
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-okf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-okf}
      POSTGRES_DB: ${POSTGRES_DB:-okf}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      # Publicado en 5433 para no chocar con un Postgres nativo en 5432. Solo
      # afecta el acceso DESDE el host (psql -p 5433); dentro de la red de
      # Compose los servicios siguen hablando por "postgres:5432".
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-okf}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      # 5673 (AMQP) y 15673 (UI) para no chocar con un RabbitMQ nativo en
      # 5672/15672. Dentro de Compose los servicios usan "rabbitmq:5672".
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Sustituye a MinIO: mismo contrato (guardar/leer bytes por clave), pero un
  # servicio propio (../object-storage) en vez de un motor S3 de terceros. La
  # API sube el original ahí; el worker lo lee de ahí y escribe el bundle.
  object-storage:
    build:
      context: ./object-storage
    environment:
      STORAGE_TOKEN: ${STORAGE_TOKEN:-cambia-esto}
    volumes:
      - objectdata:/data/objects
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    environment:
      PORT: "8080"
      POSTGRES_DSN: postgres://${POSTGRES_USER:-okf}:${POSTGRES_PASSWORD:-okf}@postgres:5432/${POSTGRES_DB:-okf}?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      STORAGE_BASE_URL: http://object-storage:9000
      STORAGE_TOKEN: ${STORAGE_TOKEN:-cambia-esto}
      JWT_SECRET: ${JWT_SECRET:-cambia-esto}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      object-storage:
        condition: service_healthy

  # Consumidor de la cola (../worker), ya no vive dentro de backend/. Sin
  # `container_name` ni puertos publicados a propósito: así se puede escalar
  # con `docker compose up --scale worker=3` sin choques de nombre/puerto.
  worker:
    build:
      context: ./worker
    environment:
      AMQP_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      DATABASE_URL: postgres://${POSTGRES_USER:-okf}:${POSTGRES_PASSWORD:-okf}@postgres:5432/${POSTGRES_DB:-okf}?sslmode=disable
      STORAGE_BACKEND: http
      STORAGE_BASE_URL: http://object-storage:9000
      STORAGE_TOKEN: ${STORAGE_TOKEN:-cambia-esto}
      LOG_FORMAT: json
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      object-storage:
        condition: service_healthy

volumes:
  pgdata:
  objectdata:
